<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    {{STYLES}}
  </head>
  <body>
    <main class="deck-viewport">
      <div class="deck-stage">{{SLIDES}}</div>
    </main>
    <div class="edit-hotzone" aria-hidden="true"></div>
    <nav class="editor-bar" aria-label="Presentation editing">
      <button id="editToggle" title="Toggle editing (E)">Edit (E)</button>
      <button id="saveFile" title="Download edited HTML (Ctrl+S)">
        Save HTML
      </button>
      <span id="editStatus" role="status"></span>
    </nav>
    {{SCRIPTS}}
  </body>
</html>
